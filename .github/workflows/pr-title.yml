name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|style|refactor|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?!?: \S.*$/u;
            if (!pattern.test(title)) {
              core.setFailed('PR 제목은 type(scope): 요약 또는 type: 요약 형식이어야 합니다. CONTRIBUTING.md를 확인하세요.');
            }
