name: 버그 신고
description: 잘못된 동작과 재현 방법을 기록합니다.
title: "[버그] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제가 발생한 페이지와 순서를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 확인 환경
      placeholder: "예: Windows / Chrome, iPhone / Safari"
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 또는 추가 정보
